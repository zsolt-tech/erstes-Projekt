<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A00">
<title>Truck Rescue – Autobahn-Demo</title>
<style>
:root{--or:#FF7A00;--or-d:#E26500;--or-l:#FFF1E3;--ink:#1D1D1B;--ink2:#2A2A27;--ink3:#383834;--mute:#9a9a93;--line:rgba(255,255,255,.1);--grn:#2FBF71;--red:#E5483F;--amb:#FFC247;--blu:#3B82F6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#12120f;color:#fff;font-size:14px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.ico{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.top{background:var(--or);box-shadow:0 2px 0 rgba(0,0,0,.25);position:sticky;top:0;z-index:30}
.top-in{max-width:1640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--ink)}
.logo-mark{width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--or);display:grid;place-items:center}
.logo-mark svg{width:32px;height:20px}
.logo b{display:block;font-size:18px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.logo small{display:block;font-size:12px;font-weight:700;color:rgba(0,0,0,.65);margin-top:3px}
.seg{display:flex;background:rgba(0,0,0,.14);border-radius:999px;padding:4px;gap:2px}
.seg button{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:800;color:var(--ink);position:relative;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg .badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:21px;height:21px;display:grid;place-items:center;font-size:12px;border:2px solid var(--or);padding:0 4px;animation:pop 1.2s infinite}
@keyframes pop{50%{transform:scale(1.18)}}
.toplink{background:rgba(0,0,0,.16);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:800;text-decoration:none;font-size:13px}
.toplink:hover{background:var(--ink);color:#fff}
.wrap{max-width:1640px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 400px;align-items:start}
@media(max-width:1060px){.wrap{grid-template-columns:1fr;padding:10px}}
#stage{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#b9d596;box-shadow:0 0 0 3px #000,0 0 0 6px var(--ink3),0 24px 60px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
.pill{background:rgba(29,29,27,.86);backdrop-filter:blur(6px);border-radius:14px;padding:7px 13px;display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.3);min-height:42px}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);line-height:1}
.pill .v{line-height:1.05;font-variant-numeric:tabular-nums}
.pill.red .v{color:#ff8a80}
.sp{flex:1}
.hbtn{width:42px;height:42px;border-radius:14px;background:rgba(29,29,27,.86);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:900}
.hbtn:hover,.hbtn.on{background:var(--or);color:var(--ink)}
#mini{position:absolute;left:10px;bottom:10px;width:230px;border-radius:12px;border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.45);cursor:crosshair;z-index:2}
#cv{cursor:grab}#cv.drag{cursor:grabbing}
#toasts{position:absolute;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,90%)}
.toast{background:rgba(29,29,27,.93);border-left:5px solid var(--or);padding:8px 14px;border-radius:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .25s ease-out,tout .4s 3.6s forwards;max-width:100%}
.toast.good{border-color:var(--grn)}.toast.bad{border-color:var(--red)}.toast.blu{border-color:var(--blu)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#side{background:var(--ink2);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.4);max-height:calc(100vh - 100px);min-height:420px;display:flex;flex-direction:column}
@media(max-width:1060px){#side{max-height:none}}
#panel{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.h{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:6px 2px 0;display:flex;justify-content:space-between}
.card{background:var(--ink3);border-radius:14px;padding:12px}
.empty{padding:18px 12px;text-align:center;color:var(--mute);font-weight:700;border:2px dashed var(--line);border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:900;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.chip.red{background:var(--red)}.chip.or{background:var(--or);color:var(--ink)}.chip.grn{background:var(--grn);color:#06361d}.chip.amb{background:var(--amb);color:#3b2a00}.chip.blu{background:var(--blu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:900;background:var(--or);color:var(--ink);min-height:44px;width:100%}
.btn:hover{background:#ff9230}.btn.ghost{background:var(--ink3);color:#fff}.btn.ghost:hover{background:#4a4a45}.btn.grn{background:var(--grn);color:#06361d}
.btn[disabled]{opacity:.4;pointer-events:none}.btn.big{padding:16px 22px;font-size:17px;border-radius:14px}
.ti{width:54px;height:36px;border-radius:10px;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.ti.dk{background:var(--ink);color:#fff}.ti svg{width:44px;height:27px}
.row{display:flex;gap:10px;align-items:center}
.unit{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--ink3);border-radius:12px}
.unit .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:11px;flex:none}
.unit .nm{font-weight:800}.unit small{display:block;color:var(--mute);font-weight:600}
.unit .r{margin-left:auto;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.pk{display:flex;align-items:center;gap:10px;background:var(--ink3);border-radius:12px;padding:8px 10px;width:100%;text-align:left;border:2px solid transparent}
.pk:hover{border-color:rgba(255,122,0,.6)}.pk.on{border-color:var(--or);background:#463722}.pk.off{opacity:.38;pointer-events:none}
.pk .nm{font-weight:800}.pk small{display:block;color:var(--mute);font-weight:600}.pk .go{margin-left:auto;text-align:right;font-weight:900;white-space:nowrap}
.qa{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}.qa dt{color:var(--mute);font-weight:700}.qa dd{margin:0;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.tl{display:flex;flex-direction:column;gap:6px}.tl div{display:flex;gap:8px;color:var(--mute);font-weight:700}.tl b{color:#fff;font-variant-numeric:tabular-nums;min-width:44px}
.tl div.d{color:#fff}
.player{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px}
.play{width:36px;height:36px;border-radius:50%;background:var(--or);color:var(--ink);display:grid;place-items:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:28px;flex:1}.wave i{width:3px;border-radius:2px;background:#77776f;height:var(--h)}.wave i.on{background:var(--or)}
.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat4 div{background:var(--ink3);border-radius:12px;padding:10px}.stat4 b{font-size:20px;display:block;font-variant-numeric:tabular-nums}.stat4 small{color:var(--mute);font-weight:700}
.spin{width:40px;height:40px;border-radius:50%;border:5px solid rgba(255,122,0,.25);border-top-color:var(--or);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;background:var(--ink3);border-radius:14px;border:2px solid transparent}
.scn:hover{border-color:rgba(255,122,0,.6)}.scn.on{border-color:var(--or);background:#463722}
.scn .ti{width:60px;height:40px}.scn b{display:block;font-size:15px}.scn small{color:var(--mute);font-weight:600;display:block}

/* Fahrer-Panel (hell, Handy-Look) */
#panel.light{background:#F2F1ED;color:var(--ink)}
.light .h{color:#8a8a85}
.light .card{background:#fff}
.light .empty{border-color:#ddd;color:#8a8a85}
.light .chip{background:#ECEBE6;color:#4a4a47}.light .chip.red{background:var(--red);color:#fff}.light .chip.or{background:var(--or);color:var(--ink)}.light .chip.grn{background:var(--grn);color:#06361d}.light .chip.amb{background:var(--amb);color:#3b2a00}
.light .btn.ghost{background:#fff;border:2px solid #e4e2dc;color:var(--ink)}
.light .unit{background:#fff}.light .unit small{color:#8a8a85}
.light .tl div{color:#8a8a85}.light .tl div.d{color:var(--ink)}.light .tl b{color:var(--ink)}
.light .scn{background:#fff}.light .scn small{color:#6f6f6a}.light .scn.on{background:var(--or-l)}.light .scn .ti{background:var(--ink);color:#fff}
.light .stat4 div{background:#fff}.light .stat4 small{color:#8a8a85}
.steps{display:flex;gap:6px}.steps div{flex:1;text-align:center;font-size:11px;font-weight:800;color:#9a9a93}.steps i{display:block;height:6px;border-radius:3px;background:#dedcd5;margin-bottom:5px}
.steps .done i{background:var(--ink)}.steps .cur i{background:var(--or)}.steps .cur{color:var(--ink)}
.h2{font-size:22px;font-weight:900;line-height:1.1;letter-spacing:-.01em}.sub{color:#5a5a56;margin-top:5px}
.q{background:#fff;border-radius:14px;padding:12px}.q h3{margin:0;font-size:15px;font-weight:800}
.q .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:6px}
.opts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{flex:1 1 auto;background:#fff;border:2px solid #e4e2dc;border-radius:12px;padding:10px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px;min-height:46px;line-height:1.2}
.opt::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #C9C7C0;flex:none}.opt.multi::before{border-radius:5px}
.opt.on{border-color:var(--or);background:var(--or-l)}.opt.on::before{border-color:var(--or);background:var(--or) radial-gradient(#fff 0 35%,transparent 38%)}
.opt.multi.on::before{background:var(--or);box-shadow:inset 0 0 0 3px var(--or-l)}
.field{display:block}.field span{display:block;font-size:12px;font-weight:800;color:#8a8a85;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input{width:100%;padding:12px;border-radius:12px;border:2px solid #e4e2dc;background:#fff;font-weight:700;font-size:16px;color:var(--ink)}.field input:focus{outline:0;border-color:var(--or)}
.plate{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.err{background:#FDECEB;color:var(--red);padding:10px 12px;border-radius:10px;font-weight:700}
.drop{border:2.5px dashed var(--or);background:var(--or-l);border-radius:16px;padding:18px;text-align:center;font-weight:800;display:block;cursor:pointer}
.drop .ico{width:34px;height:34px;color:var(--or-d);display:block;margin:0 auto 4px}.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#ddd}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.rec{text-align:center;padding:16px}.mic{width:96px;height:96px;border-radius:50%;background:var(--or);color:var(--ink);display:grid;place-items:center;margin:4px auto 10px}.mic .ico{width:42px;height:42px}
.mic.on{background:var(--red);color:#fff;animation:rec 1.2s infinite}@keyframes rec{0%{box-shadow:0 0 0 0 rgba(229,72,63,.5)}100%{box-shadow:0 0 0 24px rgba(229,72,63,0)}}
.timer{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.light .player{background:#fff}.light .wave i{background:#cfcdc6}.light .wave i.on{background:var(--or)}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.sum dt{color:#8a8a85;font-weight:700}.sum dd{margin:0;font-weight:700;text-align:right}
.eta{font-size:40px;font-weight:900;line-height:1;color:var(--or)}

#ov{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,rgba(60,38,10,.88),rgba(10,10,8,.94))}
#ov.on{display:grid}
.modal{width:100%;max-width:620px;background:var(--ink2);border-radius:26px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px var(--line);animation:mup .4s cubic-bezier(.2,1.2,.4,1);max-height:94vh;overflow-y:auto}
@keyframes mup{from{transform:translateY(30px) scale(.95);opacity:0}}
.m-h{background:var(--or);color:var(--ink);padding:20px 24px;display:flex;gap:14px;align-items:center}
.m-h h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1}.m-h p{margin:5px 0 0;font-weight:700;color:rgba(0,0,0,.7)}
.m-h .bell{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--or);display:grid;place-items:center;flex:none;animation:ringb .9s infinite}.m-h .bell .ico{width:26px;height:26px}
@keyframes ringb{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
.m-b{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:560px){.how{grid-template-columns:1fr}}
.how div{background:var(--ink3);border-radius:14px;padding:12px}.how b{display:block;margin-bottom:3px}.how span{color:#c9c9c2;font-size:13px}
.stars{display:flex;gap:4px}.stars svg{width:30px;height:30px;color:#4a4a45}.stars svg.on{color:var(--or)}

#cv{touch-action:none}
@media(max-width:760px),(pointer:coarse) and (max-width:1060px){
 body{font-size:14px;overscroll-behavior-y:none}
 .top-in{padding:6px 10px;gap:8px;flex-wrap:nowrap}
 .logo{gap:8px;min-width:0}.logo-mark{width:34px;height:34px;border-radius:9px}.logo b{font-size:14px;letter-spacing:.03em}.logo small{display:none}
 .toplink{display:none}.logo{display:none}.carchip{flex-shrink:0}.top-in{justify-content:space-between}
 .seg{padding:3px}.seg button{padding:8px 11px;font-size:13px;gap:6px}
 .wrap{padding:0;gap:0;display:block}
 #stage{position:sticky;top:50px;z-index:20;aspect-ratio:auto;height:52vh;height:52dvh;min-height:300px;border-radius:0 0 18px 18px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
 #hud{padding:6px;gap:6px}
 .pill{padding:4px 9px;min-height:34px;font-size:13px;border-radius:11px}.pill small{font-size:8.5px}

 #bZin,#bZout{display:none}
 #mini{width:116px;left:6px;bottom:6px;border-width:1.5px;border-radius:9px}

}
@media(max-width:380px){.pill:nth-child(3){display:none}}

#adm{position:fixed;top:60px;right:12px;bottom:12px;width:372px;max-width:calc(100vw - 24px);background:var(--ink2);border-radius:20px;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.6);z-index:45;display:none;flex-direction:column;overflow:hidden}
#adm.on{display:flex}
#adm .ahd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-size:17px}
#adm .ax{width:34px;height:34px;border-radius:10px;background:var(--ink3);font-weight:900}
#adm .atabs{display:flex;gap:4px;padding:0 10px 8px;flex-wrap:wrap}
#adm .atabs button{padding:7px 10px;border-radius:999px;background:var(--ink3);font-weight:800;font-size:12.5px}
#adm .atabs button.on{background:var(--or);color:var(--ink)}
#adm .abody{overflow:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}

#adm .wxg button span{font-size:22px}

#adm .asl{display:flex;flex-direction:column;gap:4px}
#adm .al{display:flex;justify-content:space-between;font-weight:700;font-size:13px;color:#d8d8d2}#adm .al b{color:var(--or)}
#adm input[type=range]{width:100%;accent-color:var(--or);height:28px}
#adm .achk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
#adm .acard{background:var(--ink3);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
#adm .acard.hot{border:2px solid var(--or)}
#adm .arow{display:flex;justify-content:space-between;gap:8px;font-size:13px}
#adm .abtn{background:var(--or);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:900;min-height:44px;width:100%}
#adm .abtn.ghost{background:var(--ink3);color:#fff}#adm .abtn.red{background:var(--red);color:#fff}#adm .abtn.left{text-align:left}
#adm .abtns{display:flex;gap:8px}
#adm .anote{font-size:12px;color:var(--mute);line-height:1.4}

@media(min-width:761px){#bAdmH{display:none}}

.carchip{background:rgba(0,0,0,.2);color:var(--ink);padding:8px 13px;border-radius:999px;font-weight:900;font-size:13px;white-space:nowrap;cursor:pointer}
.carchip:hover{background:var(--ink);color:#fff}
.upg{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08)}
.upg .ui{font-size:26px;width:40px;text-align:center}.upg .ut{flex:1;min-width:0}.upg .ut small{display:block;color:#8a8a85;font-weight:600;margin:1px 0 5px}
