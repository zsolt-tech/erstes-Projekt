<!doctype html>
<html lang="de">
<head>

<title>Truck Rescue – Depot-Manager</title>
<style>
:root{--or:#FF7A00;--or-d:#E26500;--or-l:#FFF1E3;--ink:#1D1D1B;--ink2:#2A2A27;--ink3:#383834;--mute:#9a9a93;--line:rgba(255,255,255,.1);--grn:#2FBF71;--red:#E5483F;--amb:#FFC247}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#12120f;color:#fff;font-size:14px;line-height:1.35;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ico{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.top{background:var(--or);box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative;z-index:5}
.top-in{max-width:1640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;color:var(--ink)}
.logo-mark{width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--or);display:grid;place-items:center}
.logo-mark svg{width:32px;height:20px}
.logo b{display:block;font-size:18px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.logo small{display:block;font-size:12px;font-weight:700;color:rgba(0,0,0,.65);margin-top:3px}
.toplink{background:rgba(0,0,0,.16);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:800;text-decoration:none;font-size:13px}
.toplink:hover{background:var(--ink);color:#fff}

.wrap{max-width:1640px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;padding:10px}}
#stage{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#b9d596;box-shadow:0 0 0 3px #000,0 0 0 6px var(--ink3),0 24px 60px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;touch-action:manipulation}
#hud{position:absolute;left:0;right:0;top:0;padding:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
#hud>*{pointer-events:auto}
.pill{background:rgba(29,29,27,.86);backdrop-filter:blur(6px);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.3);min-height:44px}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);line-height:1}
.pill .v{line-height:1.05;font-variant-numeric:tabular-nums}
.pill.money .ico{color:var(--amb);width:24px;height:24px}
.stars{display:flex;gap:2px}.stars svg{width:20px;height:20px;color:#4a4a45}.stars svg.on{color:var(--or)}
.sp{flex:1}
.hbtn{width:44px;height:44px;border-radius:14px;background:rgba(29,29,27,.86);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:900}
.hbtn:hover{background:var(--or);color:var(--ink)}
.hbtn.on{background:var(--or);color:var(--ink)}
#toasts{position:absolute;left:50%;top:72px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,90%)}
.toast{background:rgba(29,29,27,.92);border-left:5px solid var(--or);padding:9px 14px;border-radius:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .25s ease-out,tout .4s 3.2s forwards;max-width:100%}
.toast.good{border-color:var(--grn)}.toast.bad{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(29,29,27,.9);padding:10px 16px;border-radius:999px;font-weight:700;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap;animation:bob 2s infinite;max-width:94%;overflow:hidden;text-overflow:ellipsis}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}

#side{background:var(--ink2);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;max-height:calc(100vh - 100px);min-height:420px}
@media(max-width:1000px){#side{max-height:none}}
.tabs{display:flex;background:#161614;padding:6px;gap:4px}
.tabs button{flex:1;padding:11px 6px;border-radius:12px;font-weight:800;color:var(--mute);display:flex;justify-content:center;align-items:center;gap:7px}
.tabs button.on{background:var(--or);color:var(--ink)}
.tabs em{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
#panel{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.h{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:6px 2px 0;display:flex;justify-content:space-between}
.empty{padding:22px 12px;text-align:center;color:var(--mute);font-weight:700;border:2px dashed var(--line);border-radius:14px}
.inc{display:flex;gap:11px;align-items:center;background:var(--ink3);border-radius:14px;padding:10px;border:2px solid transparent;text-align:left;width:100%}
.inc:hover{border-color:rgba(255,122,0,.5)}.inc.sel{border-color:var(--or);background:#463722}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:900;background:var(--or);color:var(--ink);min-height:44px}
.btn:hover{background:#ff9230}.btn.ghost{background:var(--ink3);color:#fff}.btn.ghost:hover{background:#4a4a45}
.btn[disabled]{opacity:.4;pointer-events:none}.btn.big{padding:16px 26px;font-size:18px;border-radius:14px}

.fl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--ink3);border-radius:12px;border:2px solid transparent;width:100%;text-align:left}
.fl.sel{border-color:var(--or)}.fl.can:hover{border-color:rgba(255,122,0,.5)}
.fl .nm{font-weight:800}.fl small{display:block;color:var(--mute);font-weight:600}.fl .st{margin-left:auto}
.shop{background:var(--ink3);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}

.stat4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat4 div{background:var(--ink3);border-radius:12px;padding:10px}.stat4 b{font-size:20px;font-variant-numeric:tabular-nums;display:block}.stat4 small{color:var(--mute);font-weight:700}

#ov{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:radial-gradient(circle at 50% 30%,rgba(60,38,10,.88),rgba(10,10,8,.94))}
#ov.on{display:grid}
.modal{width:100%;max-width:640px;background:var(--ink2);border-radius:26px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px var(--line);animation:mup .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes mup{from{transform:translateY(30px) scale(.95);opacity:0}}
.m-h{background:var(--or);color:var(--ink);padding:22px 26px;position:relative;overflow:hidden}
.m-h h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1}
.m-h p{margin:6px 0 0;font-weight:700;color:rgba(0,0,0,.7)}
.m-h svg.bgt{position:absolute;right:-10px;top:-4px;width:210px;height:126px;opacity:.16;color:#000}
.m-b{padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.how div{background:var(--ink3);border-radius:14px;padding:12px}.how b{display:block;margin-bottom:3px}.how span{color:#c9c9c2;font-size:13px}

<script>
'use strict';
/* =====================================================================
   TRUCK RESCUE – Depot-Manager (Minigame)
   Einsätze erscheinen auf der Karte. Schicke das passende Fahrzeug aus dem
   Depot los, birg das Wrack, bring es zurück – und baue dein Depot aus.
   ===================================================================== */
const $ = s => document.querySelector(s);
const W = 1280, H = 720, NX = 6, NY = 5;
const X = [110, 340, 570, 800, 1030, 1200], Y = [70, 230, 400, 570, 700];
const VN = ['Hafenstraße', 'Mühlenweg', 'Ringstraße', 'A7', 'Ostring', 'Gewerbeallee'];
const HN = ['Nordring', 'B27', 'Zentralachse', 'Südtangente', 'Logistikweg'];
const vw = i => i === 3 ? 52 : 34, hw_ = j => j === 1 ? 40 : 34;
const DAYLEN = 100, BEST_KEY = 'truckrescue.game.best';

/* ---------- Straßennetz ---------- */
const NODES = []; for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) NODES.push({ x: X[i], y: Y[j], i, j });
const nid = (i, j) => j * NX + i;
const EDGES = [];
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
  if (i < NX - 1) EDGES.push({ a: nid(i, j), b: nid(i + 1, j), f: j === 1 ? 1.3 : 1, w: hw_(j), name: HN[j], h: true, k: j });
  if (j < NY - 1 && !(i === 2 && j === 2)) EDGES.push({ a: nid(i, j), b: nid(i, j + 1), f: i === 3 ? 1.7 : 1, w: vw(i), name: VN[i], h: false, k: i });
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function route(P, Q) {
  const nodes = NODES.map(n => ({ x: n.x, y: n.y })), adj = nodes.map(() => []);
  EDGES.forEach(e => { const l = dist(nodes[e.a], nodes[e.b]); adj[e.a].push({ to: e.b, len: l, f: e.f }); adj[e.b].push({ to: e.a, len: l, f: e.f }); });
  const onSeg = (a, b, p) => (Math.abs(a.x - b.x) < .1 ? Math.abs(p.x - a.x) < .8 && p.y >= Math.min(a.y, b.y) - .8 && p.y <= Math.max(a.y, b.y) + .8
    : Math.abs(p.y - a.y) < .8 && p.x >= Math.min(a.x, b.x) - .8 && p.x <= Math.max(a.x, b.x) + .8);
  function insert(p) {
    for (let i = 0; i < nodes.length; i++) if (Math.hypot(nodes[i].x - p.x, nodes[i].y - p.y) < .9) return i;
    for (let u = 0; u < adj.length; u++) for (const e of adj[u]) {
      const v = e.to; if (u > v) continue;
      if (onSeg(nodes[u], nodes[v], p)) {
        const f = e.f, w = nodes.length; nodes.push({ x: p.x, y: p.y }); adj.push([]);
        adj[u] = adj[u].filter(x => x.to !== v); adj[v] = adj[v].filter(x => x.to !== u);
        const l1 = dist(nodes[u], p), l2 = dist(p, nodes[v]);
        adj[u].push({ to: w, len: l1, f }); adj[w].push({ to: u, len: l1, f }); adj[w].push({ to: v, len: l2, f }); adj[v].push({ to: w, len: l2, f });
        return w;
      }
    }
    return -1;
  }
  const s = insert(P), t = insert(Q);
  if (s < 0 || t < 0) return [{ x: P.x, y: P.y, f: 1 }, { x: Q.x, y: Q.y, f: 1 }];
  if (s === t) return [{ x: P.x, y: P.y, f: 1 }];
  const d = nodes.map(() => Infinity), prev = nodes.map(() => null), done = nodes.map(() => false); d[s] = 0;
  for (;;) {
    let u = -1; for (let i = 0; i < d.length; i++) if (!done[i] && (u < 0 || d[i] < d[u])) u = i;
    if (u < 0 || d[u] === Infinity || u === t) break; done[u] = true;
    for (const e of adj[u]) { const c = d[u] + e.len / e.f; if (c < d[e.to]) { d[e.to] = c; prev[e.to] = { u, f: e.f }; } }
  }
  const out = []; let c = t; while (c !== s && prev[c]) { out.push({ x: nodes[c].x, y: nodes[c].y, f: prev[c].f }); c = prev[c].u; }
  out.push({ x: nodes[s].x, y: nodes[s].y, f: 1 }); return out.reverse();
}
const pathLen = p => p.slice(1).reduce((a, q, i) => a + dist(q, p[i]), 0);
function trimEnd(p, d) {
  p = p.map(q => ({ ...q }));
  while (p.length > 2 && dist(p[p.length - 1], p[p.length - 2]) <= d) { d -= dist(p[p.length - 1], p[p.length - 2]); p.pop(); }
  const a = p[p.length - 2], b = p[p.length - 1], l = dist(a, b);
  if (l > d + 1) { const k = (l - d) / l; b.x = a.x + (b.x - a.x) * k; b.y = a.y + (b.y - a.y) * k; }
  return p;
}

/* ---------- Depot ---------- */
const BX = i => 382 + 36 * i, BY = 472, ROADY = 400;
const LOT = { x: 362, y: 422, w: 407, h: 126 };
const BAYS = [4, 7, 11], BAYCOST = [0, 1400, 3200];
const TYPES = [

    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(mx - 8, my + 15); g.lineTo(mx, my + 27); g.lineTo(mx + 8, my + 15); g.fill();
    g.fillStyle = inc.urgent ? '#e5483f' : '#fff'; g.beginPath(); g.arc(mx, my, 21, 0, 7); g.fill();
    g.lineWidth = 5; g.strokeStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.arc(mx, my, 21, 0, 7); g.stroke();
    if (inc.state !== 'working') { g.strokeStyle = frac > .5 ? '#2fbf71' : frac > .25 ? '#ffb020' : '#e5483f'; if (inc.urgent) g.strokeStyle = frac > .25 ? '#ffe27a' : '#1d1d1b'; g.beginPath(); g.arc(mx, my, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); g.stroke(); }
    else { g.strokeStyle = '#FF7A00'; g.beginPath(); g.arc(mx, my, 21, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ((now * .8) % 1)); g.stroke(); }
    g.save(); g.translate(mx, my + 1); g.scale(.3, .3); g.rotate(0); g.fillStyle = '#fff'; drawTruck(g, inc.cls, {}); g.restore();
    g.fillStyle = '#1d1d1b'; g.font = '900 11px system-ui'; g.textAlign = 'center'; g.fillStyle = inc.urgent ? '#fff' : '#1d1d1b';
    if (inc.state === 'enroute') { g.fillStyle = '#1d1d1b'; rr(g, mx - 17, my + 24, 34, 13, 6); g.fill(); g.fillStyle = '#FF7A00'; g.font = '900 9px system-ui'; g.fillText('UNTERWEGS', mx, my + 31); }
    else if (inc.urgent) { g.fillStyle = '#e5483f'; rr(g, mx - 17, my + 24, 34, 13, 6); g.fill(); g.fillStyle = '#fff'; g.font = '900 9px system-ui'; g.fillText('EILIG', mx, my + 31); }
  });
  // Partikel
  G.parts.forEach(p => {
    const a = p.l / p.m;
    if (p.k === 'smoke') { g.fillStyle = `rgba(60,60,64,${.45 * a})`; g.beginPath(); g.arc(p.x, p.y, p.r * (1.4 - a * .6) + 2, 0, 7); g.fill(); }
    else if (p.k === 'spark') { g.fillStyle = `rgba(255,${180 + a * 60 | 0},60,${a})`; g.fillRect(p.x, p.y, 2.4, 2.4); }
    else { g.globalAlpha = Math.min(1, a * 2); g.font = '900 20px system-ui'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(p.txt, p.x, p.y); g.fillStyle = p.col; g.fillText(p.txt, p.x, p.y); g.globalAlpha = 1; }
  });
  if (dk > .3) { const vg = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,20,${.35 * dk})`); g.fillStyle = vg; g.fillRect(0, 0, W, H); }
}

/* ---------- UI ---------- */
function toast(msg, cls = '') { const d = document.createElement('div'); d.className = 'toast ' + cls; d.textContent = msg; const box = $('#toasts'); box.appendChild(d); while (box.children.length > 4) box.firstChild.remove(); setTimeout(() => d.remove(), 3700); }
const panel = $('#panel'); let lastSig = '';
function sigNow() {
  return [G.tab, G.sel, G.selT, G.bays, G.upg.turbo, G.upg.tow, G.rep, G.running, G.incs.map(i => i.id + i.state).join(','), G.trucks.map(t => t.id + t.state + t.bay).join(','),
    TYPES.map(t => G.money >= t.cost ? 1 : 0).join(''), G.money >= 1400 ? 1 : 0, G.money >= 3200 ? 1 : 0, G.money >= 1800 ? 1 : 0, G.money >= 1600 ? 1 : 0].join('|');
}
function renderPanel() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === G.tab));
  const nWait = G.incs.filter(i => i.state === 'wait').length; const tb = document.querySelector('[data-tab=dispatch]'); tb.innerHTML = 'Disposition' + (nWait ? `<em>${nWait}</em>` : '');
  panel.innerHTML = G.tab === 'dispatch' ? dispatchHTML() : shopHTML();
}
function dispatchHTML() {
  const sInc = getInc(G.sel), idle = G.trucks.filter(t => t.state === 'bay');
  let h = `<div class="h"><span>Einsätze</span><span>${G.incs.length}</span></div>`;
  h += G.incs.length ? G.incs.slice().sort((a, b) => a.t / a.max - b.t / b.max).map(i => `<button class="inc ${i.id === G.sel ? 'sel' : ''}" data-act="selInc" data-id="${i.id}"><div class="ti">${tIc(i.cls)}</div><div class="im"><b>${INC[i.cls].name}${i.urgent ? '<span class="chip red">Eilig</span>' : ''}</b><small>${i.street}</small><div class="tb"><i data-bar="${i.id}"></i></div></div><div class="tm" data-t="${i.id}">${i.state === 'working' ? '…' : Math.ceil(i.t) + 's'}</div></button>`).join('') : '<div class="empty">Gerade ist alles ruhig …<br>Neue Einsätze erscheinen automatisch.</div>';
  if (sInc && sInc.state === 'wait') {
    const el = idle.map(t => ({ t, ok: t.type >= sInc.cls, eta: etaOf(t, sInc) })).sort((a, b) => (b.ok - a.ok) || (a.t.type - b.t.type) || (a.eta - b.eta));
    const best = el.find(x => x.ok);
    h += `<div class="send"><div class="h" style="margin:0"><span>Fahrzeug senden</span><span>Benötigt: ${TYPES[sInc.cls].size}</span></div>`;
    h += el.length ? el.map(({ t, ok, eta }) => `<button class="pk ${ok ? '' : 'off'} ${best && best.t === t ? 'rec' : ''}" data-act="send" data-id="${t.id}"><div class="ti dk">${tIc(t.type, 40, 24)}</div><div><span class="nm">${t.name}</span><small>${ok ? (best && best.t === t ? 'Empfohlen' : TYPES[t.type].size) : 'Zu klein'}</small></div><div class="go">${ok ? Math.ceil(eta) + ' s' : '–'}<small>Anfahrt</small></div></button>`).join('') : '<div class="empty" style="padding:14px">Kein Fahrzeug im Depot – warte, bis eins zurück ist.</div>';
    h += best ? `<button class="btn grn" data-act="auto" data-id="${sInc.id}">Beste Wahl senden</button>` : '';
    h += '</div>';
  } else if (sInc) h += '<div class="empty">Dieser Einsatz wird bereits bearbeitet.</div>';
  h += `<div class="h"><span>Fuhrpark</span><span>${G.trucks.length}/${G.bays} Plätze</span></div>`;
  h += G.trucks.map(t => `<button class="fl ${t.id === G.selT ? 'sel' : ''} ${t.state === 'bay' ? 'can' : ''}" data-act="selTr" data-id="${t.id}"><div class="ti dk">${tIc(t.type, 40, 24)}</div><div><span class="nm">${t.name}</span><small>${TYPES[t.type].size} · ${TYPES[t.type].desc}</small></div><span class="st chip ${t.state === 'bay' ? 'grn' : t.state === 'work' ? 'or' : 'amb'}">${STATE_TX[t.state]}</span></button>`).join('');
  return h;
}
function shopHTML() {
  const free = freeBay() >= 0;
  let h = `<div class="stat4"><div><b>${fmt(G.money)}</b><small>Kasse</small></div><div><b>${G.jobs}</b><small>Bergungen</small></div><div><b>${fmt(G.earned)}</b><small>Umsatz gesamt</small></div><div><b>${G.fails}</b><small>Verpasst</small></div></div>`;
  h += `<div class="h"><span>Fahrzeuge kaufen</span><span>${G.trucks.length}/${G.bays} Plätze</span></div>`;
  h += TYPES.map((T, i) => `<div class="shop"><div class="ti big">${tIc(i, 52, 32)}</div><div class="tx"><b>${T.name} <span class="chip">${T.size}</span></b><small>${T.desc}</small><span class="price">${fmt(T.cost)}</span></div><button class="btn" data-act="buy" data-i="${i}" ${G.money >= T.cost && free ? '' : 'disabled'}>Kaufen</button></div>`).join('');
  if (!free) h += '<div class="empty" style="padding:10px">Alle Stellplätze belegt – baue das Depot aus.</div>';
  const lv = BAYS.indexOf(G.bays);
  h += `<div class="h"><span>Depot &amp; Technik</span></div>`;
  h += lv < 2 ? `<div class="shop"><div class="tx"><b>Depot erweitern</b><small>${BAYS[lv]} → ${BAYS[lv + 1]} Stellplätze</small><span class="price">${fmt(BAYCOST[lv + 1])}</span></div><button class="btn" data-act="bays" ${G.money >= BAYCOST[lv + 1] ? '' : 'disabled'}>Ausbauen</button></div>` : '<div class="shop"><div class="tx"><b>Depot erweitern</b><small>Maximale Ausbaustufe erreicht</small></div><span class="chip grn">Fertig</span></div>';
  h += `<div class="shop"><div class="tx"><b>Turbo-Motoren</b><small>Alle Fahrzeuge fahren 20 % schneller</small><span class="price">${fmt(1800)}</span></div>${G.upg.turbo ? '<span class="chip grn">Gekauft</span>' : `<button class="btn" data-act="upg" data-k="turbo" ${G.money >= 1800 ? '' : 'disabled'}>Kaufen</button>`}</div>`;
  h += `<div class="shop"><div class="tx"><b>Hydraulik-Winden</b><small>Bergungen dauern 25 % kürzer</small><span class="price">${fmt(1600)}</span></div>${G.upg.tow ? '<span class="chip grn">Gekauft</span>' : `<button class="btn" data-act="upg" data-k="tow" ${G.money >= 1600 ? '' : 'disabled'}>Kaufen</button>`}</div>`;
  return h;
}
function renderAll(force) { const s = sigNow(); if (force || s !== lastSig) { lastSig = s; renderPanel(); } hint(); }
function hint() {
  const h = $('#hint'); let t = '';
  if (!G.running) t = ''; else if (G.hint) t = G.sel || G.selT ? 'Jetzt ein passendes Fahrzeug bzw. einen Einsatz anklicken' : 'Klicke einen Einsatz auf der Karte – dann ein Fahrzeug aus dem Depot';
  h.style.display = t ? '' : 'none'; h.textContent = t;
}
function hud() {
  G.dshow += (G.money - G.dshow) * .2; if (Math.abs(G.money - G.dshow) < 1) G.dshow = G.money;
  $('#hMoney').textContent = fmt(G.dshow); const h = hourOf(); $('#hClock').textContent = pad2(Math.floor(h)) + ':' + pad2(Math.floor((h % 1) * 60)); $('#hDay').textContent = 'Tag ' + G.day;
  const st = $('#hStars'); if (st.dataset.v !== String(G.rep)) { st.dataset.v = G.rep; st.innerHTML = [0, 1, 2, 3, 4].map(i => `<svg class="${i < G.rep ? 'on' : ''}" viewBox="0 0 24 24">${IC.star}</svg>`).join(''); }
  document.querySelectorAll('[data-bar]').forEach(b => { const i = getInc(+b.dataset.bar); if (!i) return; const f = clamp(i.t / i.max, 0, 1); b.style.width = f * 100 + '%'; b.style.background = f > .5 ? '#2fbf71' : f > .25 ? '#ffb020' : '#e5483f'; if (i.state === 'working') b.style.background = '#FF7A00'; });
  document.querySelectorAll('[data-t]').forEach(b => { const i = getInc(+b.dataset.t); if (i) b.textContent = i.state === 'working' ? '…' : Math.ceil(i.t) + 's'; });
}
function setBtns() { $('#bPause').innerHTML = ic(G.paused ? 'play' : 'pause'); $('#bSpeed').textContent = G.speed + '×'; $('#bSpeed').classList.toggle('on', G.speed > 1); $('#bSound').innerHTML = ic(G.mute ? 'mute' : 'snd'); $('#bPause').classList.toggle('on', G.paused); }

function showOverlay(kind) {
  const ov = $('#ov'); if (!kind) { ov.classList.remove('on'); ov.innerHTML = ''; return; }
  const best = G.best ? `<span class="best">Rekord: ${fmt(G.best)}</span>` : '';
  if (kind === 'start') ov.innerHTML = `<div class="modal"><div class="m-h"><svg class="bgt" viewBox="0 0 80 48"><use href="#i-heavy"/></svg><h1>Depot-Manager</h1><p>Führe dein eigenes Abschleppunternehmen für LKW.</p></div>
    <div class="m-b"><div class="how"><div><span class="n">1</span><b>Einsatz wählen</b><span>Unfälle und Pannen erscheinen auf der Karte. Der Ring zeigt, wie viel Zeit bleibt.</span></div><div><span class="n">2</span><b>Passendes Fahrzeug senden</b><span>Kleine Pannen schafft ein Abschlepper – Sattelzüge brauchen Schwerlast.</span></div><div><span class="n">3</span><b>Bergen &amp; kassieren</b><span>Wrack laden, zurück ins Depot – je schneller, desto mehr Geld.</span></div></div>
    <div class="sizes">${TYPES.map((T, i) => `<div><div class="ti dk">${tIc(i)}</div>${T.name}<small>${T.size} · ${T.desc}</small></div>`).join('')}</div>
    <div class="row"><button class="btn big" data-act="start">Schicht starten</button>${best}</div></div></div>`;
  if (kind === 'pause') ov.innerHTML = `<div class="modal" style="max-width:420px"><div class="m-h"><h1>Pause</h1><p>Das Depot wartet auf dich.</p></div><div class="m-b"><button class="btn big" data-act="resume">Weiterspielen</button><button class="btn ghost" data-act="restart">Neu starten</button></div></div>`;
  if (kind === 'over') ov.innerHTML = `<div class="modal" style="max-width:480px"><div class="m-h"><h1>Schicht beendet</h1><p>Dein Ruf ist ruiniert – zu viele Einsätze verpasst.</p></div><div class="m-b"><div class="stat4"><div><b>${fmt(G.earned)}</b><small>Umsatz</small></div><div><b>${G.jobs}</b><small>Bergungen</small></div><div><b>Tag ${G.day}</b><small>erreicht</small></div><div><b>${G.trucks.length}</b><small>Fahrzeuge</small></div></div>${G.earned >= G.best && G.earned > 0 ? '<div class="chip grn" style="align-self:flex-start">Neuer Rekord!</div>' : `<span class="best">Rekord: ${fmt(G.best)}</span>`}<button class="btn big" data-act="restart">Nochmal spielen</button></div></div>`;
  ov.classList.add('on');
}

/* ---------- Eingabe ---------- */
const ACT = {
  start: () => { newGame(); },
  restart: () => { newGame(); },
  resume: () => { setPause(false); },
  selInc: d => { const i = getInc(+d.id); if (!i) return; G.sel = G.sel === i.id ? null : i.id; if (G.selT && G.sel) { const t = getTr(G.selT); if (t && i.state === 'wait') { dispatch(t, i); return; } } renderAll(true); },
  selTr: d => { const t = getTr(+d.id); if (!t || t.state !== 'bay') return; const inc = getInc(G.sel); if (inc && inc.state === 'wait') { dispatch(t, inc); return; } G.selT = G.selT === t.id ? null : t.id; renderAll(true); },
  send: d => dispatch(getTr(+d.id), getInc(G.sel)),
  auto: d => { const inc = getInc(+d.id); const idle = G.trucks.filter(t => t.state === 'bay' && t.type >= inc.cls).sort((a, b) => (a.type - b.type) || (etaOf(a, inc) - etaOf(b, inc))); if (idle[0]) dispatch(idle[0], inc); },
  buy: d => { const T = TYPES[+d.i]; if (G.money >= T.cost && freeBay() >= 0) { G.money -= T.cost; addTruck(+d.i); sfx.buy(); toast(`${T.name} gekauft!`, 'good'); renderAll(true); } },
  bays: () => { const lv = BAYS.indexOf(G.bays); if (lv < 2 && G.money >= BAYCOST[lv + 1]) { G.money -= BAYCOST[lv + 1]; G.bays = BAYS[lv + 1]; sfx.buy(); toast('Depot erweitert!', 'good'); renderAll(true); } },
  upg: d => { const c = d.k === 'turbo' ? 1800 : 1600; if (!G.upg[d.k] && G.money >= c) { G.money -= c; G.upg[d.k] = true; sfx.buy(); toast('Upgrade gekauft!', 'good'); renderAll(true); } },
};
function setPause(p) { if (!G.running) return; G.paused = p; setBtns(); showOverlay(p ? 'pause' : null); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) { ACT[t.dataset.act](t.dataset); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { G.tab = tab.dataset.tab; renderAll(true); }
});
$('#bPause').onclick = () => G.running && setPause(!G.paused);
$('#bSpeed').onclick = () => { G.speed = G.speed === 1 ? 2 : 1; setBtns(); };
$('#bSound').onclick = () => { G.mute = !G.mute; setBtns(); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && G.running) { e.preventDefault(); setPause(!G.paused); }
  else if (e.key === '1') { G.speed = 1; setBtns(); } else if (e.key === '2') { G.speed = 2; setBtns(); }
  else if (e.key === 'Escape') { G.sel = G.selT = null; renderAll(true); }
  else if ((e.key === 'a' || e.key === 'A') && G.sel) ACT.auto({ id: G.sel });
});
cv.addEventListener('click', e => {
  if (!G.running || G.paused) return; const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  let inc = null, bd = 48; G.incs.forEach(i => { const d = Math.min(Math.hypot(i.x - x, i.y - y), Math.hypot(i.x - x, i.y - 50 - y)); if (d < bd) { bd = d; inc = i; } });
  let tr = null, bt = 30; G.trucks.forEach(t => { if (t.state !== 'bay') return; const d = Math.hypot(t.x - x, t.y - y) * .8 - (TYPES[t.type].L / 2 - 18); if (d < bt) { bt = d; tr = t; } });
  if (inc && (!tr || bd < bt)) ACT.selInc({ id: inc.id }); else if (tr) ACT.selTr({ id: tr.id }); else { G.sel = G.selT = null; renderAll(true); }
});
cv.addEventListener('mousemove', e => { if (!G.running) return; const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H; cv.style.cursor = G.incs.some(i => Math.hypot(i.x - x, i.y - y) < 48 || Math.hypot(i.x - x, i.y - 50 - y) < 28) || G.trucks.some(t => t.state === 'bay' && Math.hypot(t.x - x, t.y - y) < 36) ? 'pointer' : 'default'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.running && !G.paused) setPause(true); });
window.addEventListener('resize', fit);

/* ---------- Start ---------- */
let last = performance.now(), acc = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  if (G.running && !G.paused) { const n = G.speed; for (let k = 0; k < n; k++) update(dt); }
  draw(); hud(); if ((acc += dt) > .15) { acc = 0; renderAll(); }
  requestAnimationFrame(frame);
}
BG = buildBG(); fit(); addTruck(0); addTruck(1); setBtns(); renderAll(true); showOverlay('start');
requestAnimationFrame(frame);
</script>
