<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7A00">
<title>Truck Rescue – Abschlepp-Disposition</title>
<style>
:root{
  --or:#FF7A00; --or-d:#E26500; --or-l:#FFF1E3; --or-m:#FFD6AD;
  --ink:#1D1D1B; --ink2:#4A4A47; --mute:#8A8A85; --line:#E4E2DC;
  --bg:#F2F1ED; --card:#fff; --red:#D9302C; --red-l:#FDECEB; --grn:#1E9A55; --grn-l:#E5F5EC; --blu:#2765C9;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.ico{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}

/* ---------- Kopfzeile ---------- */
.top{background:var(--or);position:sticky;top:0;z-index:30;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-mark{width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--or);display:grid;place-items:center}
.logo-mark svg{width:34px;height:22px}
.logo b{display:block;font-size:19px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.logo small{display:block;font-size:12px;font-weight:600;color:rgba(0,0,0,.65);margin-top:3px}
.seg{display:flex;background:rgba(0,0,0,.14);border-radius:999px;padding:4px;gap:2px}
.seg button{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink);position:relative;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg .badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:21px;height:21px;display:grid;place-items:center;font-size:12px;border:2px solid var(--or);padding:0 4px;animation:pop 1.2s infinite}
@keyframes pop{50%{transform:scale(1.18)}}

/* ---------- Allgemein ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.03)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:12px;font-weight:800;font-size:15px;transition:.15s;min-height:48px}
.btn.pri{background:var(--or);color:var(--ink)}
.btn.pri:hover{background:var(--or-d);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.grn{background:var(--grn);color:#fff}
.btn.big{padding:18px 24px;font-size:18px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#EEE;color:var(--ink2);white-space:nowrap}
.chip.or{background:var(--or-l);color:var(--or-d)}
.chip.red{background:var(--red-l);color:var(--red)}
.chip.grn{background:var(--grn-l);color:var(--grn)}
.chip.dark{background:var(--ink);color:#fff}
.lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}

/* ---------- Fahrer (Handy-Rahmen) ---------- */
.drv-wrap{padding:20px 12px 40px;display:flex;justify-content:center}
.phone{width:100%;max-width:440px;background:var(--bg);border-radius:30px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 8px #1d1d1b;min-height:760px;display:flex;flex-direction:column;position:relative}
.phone-bar{background:var(--ink);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;font-weight:800}
.phone-bar .ico{color:var(--or)}
.phone-bar small{margin-left:auto;font-weight:600;color:#bbb}
.phone-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:14px}
.phone-foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:18px 16px 16px;display:flex;gap:10px}
.phone-foot .btn{flex:1}
.phone-foot .btn.ghost{flex:0 0 auto}
.steps{display:flex;gap:6px}
.steps div{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--mute)}
.steps i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:5px}
.steps .done i{background:var(--ink)} .steps .cur i{background:var(--or)} .steps .cur{color:var(--ink)}
.h2{font-size:24px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.sub{color:var(--ink2);margin-top:6px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--or)}
.hero p{color:#cfcfca;margin:10px 0 18px}
.hero .bg-truck{position:absolute;right:-14px;top:8px;width:190px;height:114px;color:#fff;opacity:.09}
.hero>*:not(.bg-truck){position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;font-size:12px;font-weight:800}
.tile .ico{display:block;margin:0 auto 6px;width:28px;height:28px;color:var(--or)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.opt{flex:1 1 auto;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 12px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px;min-height:48px;line-height:1.2}
.opt::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #C9C7C0;flex:none}
.opt.multi::before{border-radius:5px}
.opt.on{border-color:var(--or);background:var(--or-l)}
.opt.on::before{border-color:var(--or);background:var(--or) radial-gradient(#fff 0 35%,transparent 38%)}
.opt.multi.on::before{background:var(--or);box-shadow:inset 0 0 0 3px var(--or-l)}
.q{background:#fff;border-radius:14px;padding:14px}
.q h3{font-size:15px;font-weight:800}
.q .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:6px}
.field{display:block}
.field span{display:block;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:16px}
.field input:focus{outline:0;border-color:var(--or)}
.plate{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.err{background:var(--red-l);color:var(--red);padding:10px 12px;border-radius:10px;font-weight:700;display:flex;gap:8px;align-items:center}
.locbox{display:flex;gap:12px;align-items:center;padding:12px}
.locbox .ico{color:var(--or);width:26px;height:26px}
.minimap{border-radius:12px;overflow:hidden;line-height:0}
.minimap svg{width:100%;height:190px;display:block}

.drop{border:2.5px dashed var(--or);background:var(--or-l);border-radius:16px;padding:22px;text-align:center;font-weight:800;display:block;cursor:pointer}
.drop .ico{width:38px;height:38px;color:var(--or-d);display:block;margin:0 auto 6px}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.hints{display:flex;gap:6px;flex-wrap:wrap}

.rec{text-align:center;padding:22px 16px}
.mic{width:116px;height:116px;border-radius:50%;background:var(--or);color:var(--ink);display:grid;place-items:center;margin:8px auto 14px;position:relative;transition:.2s}
.mic .ico{width:50px;height:50px}
.mic.on{background:var(--red);color:#fff;animation:rec 1.2s infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 rgba(217,48,44,.5)}100%{box-shadow:0 0 0 26px rgba(217,48,44,0)}}
.timer{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:44px;margin:10px 0}
.wave i{width:4px;border-radius:2px;background:#CFCDC6;height:var(--h)}
.wave.live i{background:var(--red);animation:wv .7s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.wave i.on{background:var(--or)}
.player{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px}
.player .play{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.player .wave{margin:0;flex:1;justify-content:flex-start;height:32px}
.player .wave i{width:3px}
.player time{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;min-width:38px;text-align:right}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.sum dt{color:var(--mute);font-weight:700}
.sum dd{margin:0;font-weight:700;text-align:right}

.status{border-radius:20px;padding:20px;background:#fff}
.status.ok{background:var(--ink);color:#fff}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--or-m);border-top-color:var(--or);animation:sp 1s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.eta{font-size:54px;font-weight:900;line-height:1;color:var(--or)}
.eta small{font-size:18px;color:#fff;font-weight:800;margin-left:6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--or);width:0;transition:width .3s linear}
.tl{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tl div{display:flex;gap:12px;align-items:flex-start;color:var(--mute);font-weight:700}
.tl div b{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:12px}
.tl .d{color:var(--ink)} .tl .d b{background:var(--grn)}
.tl .c{color:var(--ink)} .tl .c b{background:var(--or)}

/* ---------- Karte ---------- */
.map{line-height:0;border-radius:var(--r);overflow:hidden;background:#EDEBE6;position:relative}
.map > svg{width:100%;height:100%;display:block}
.map.tall > svg{height:min(62vh,540px);min-height:340px}
.pin .ring{fill:rgba(255,122,0,.35);transform-box:fill-box;transform-origin:center;opacity:0}
.pin .pb{fill:var(--or);stroke:#fff;stroke-width:2.5}
.pin.act .pb{fill:var(--ink)} .pin.act .pw{fill:var(--or)} .pin.done .pb{fill:#9d9d98}
.pin.new .ring{animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pin{cursor:pointer}
.pin.sel .pb{stroke:var(--ink);stroke-width:3.5}
.map-legend{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;line-height:1}
.map-legend span{background:rgba(255,255,255,.94);padding:6px 9px;border-radius:8px;display:flex;align-items:center;gap:6px}
.map-legend i{width:10px;height:10px;border-radius:50%;background:var(--or);display:block}
.map-badge{position:absolute;right:10px;top:10px;background:var(--ink);color:#fff;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:800;line-height:1;display:flex;gap:6px;align-items:center}

/* ---------- Disponent ---------- */
.disp{max-width:1500px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.disp{grid-template-columns:350px minmax(0,1fr)}}
.dmain{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-content:start}
@media(min-width:1280px){.dmain{grid-template-columns:minmax(0,1fr) 410px}.dmain .mapcol{position:sticky;top:84px;align-self:start}}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1}
.stat span{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.stat.hot b{color:var(--or-d)}
.tabs{display:flex;gap:4px;padding:6px;background:#E8E6E0;border-radius:12px}
.tabs button{flex:1;padding:9px 6px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs em{font-style:normal;background:var(--or);color:var(--ink);border-radius:999px;padding:1px 7px;margin-left:4px;font-size:12px}
.orders{display:flex;flex-direction:column;gap:8px}
.ord{background:#fff;border-radius:12px;padding:12px 14px;text-align:left;border:2px solid transparent;display:block;width:100%}
.ord:hover{border-color:var(--or-m)}
.ord.on{border-color:var(--or);background:var(--or-l)}
.ord.fresh{box-shadow:0 0 0 3px rgba(255,122,0,.35)}
.ord .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ord b{font-weight:900}
.ord .r2{margin:5px 0 7px;font-weight:700}
.ord .r3{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:26px 14px;font-weight:700}
.fleet .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fleet .row:first-of-type{border-top:0}
.fleet .ti{width:54px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.fleet .ti svg{width:42px;height:26px}
.fleet .row.busy .ti{background:#a9a9a4}
.fleet .nm{font-weight:900} .fleet small{color:var(--mute);font-weight:700;display:block}
.fleet .row > div:nth-child(2){flex:1;min-width:0}
.dh{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.dh h2{font-size:22px;font-weight:900}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec .lbl{margin-bottom:8px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.qa{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.qa dt{color:var(--mute);font-weight:700} .qa dd{margin:0;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#ddd;display:block}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.pick.on{border-color:var(--or);background:var(--or-l)}
.pick .ti{width:54px;height:36px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.pick .ti svg{width:42px;height:26px}
.pick .nm{font-weight:900} .pick small{display:block;color:var(--ink2);font-weight:700}
.pick .go{margin-left:auto;text-align:right;font-weight:900;white-space:nowrap}
.pick.off{opacity:.45;pointer-events:none}
.acts{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);background:#FAF9F6;border-radius:0 0 var(--r) var(--r)}
.acts .btn{flex:1}
.acts .btn.danger{flex:0 0 auto}

/* ---------- Overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.66);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.alert{background:#fff;border-radius:22px;width:100%;max-width:470px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5);animation:up .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(40px) scale(.94);opacity:0}}
.alert-h{background:var(--or);padding:18px 20px;display:flex;gap:14px;align-items:center}
.alert-h .bell{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--or);display:grid;place-items:center;animation:ringb .9s infinite}
.alert-h .bell .ico{width:28px;height:28px}
@keyframes ringb{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}}
.alert-h b{font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1.1}
.alert-h small{font-weight:700;color:rgba(0,0,0,.7)}
.alert-b{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.lb img{max-width:min(94vw,900px);max-height:88vh;border-radius:14px;display:block}

@media(max-width:560px){
  .top-in{padding:8px 12px;gap:8px}
  .logo small{display:none}
  .seg{width:100%} .seg button{flex:1;justify-content:center;padding:10px 6px}
  .drv-wrap{padding:0}
  .phone{border-radius:0;box-shadow:none;min-height:calc(100vh - 118px)}
}
</style>
</head>
<body>

    <g fill="#bdbdb8"><circle cx="17" cy="38" r="2"/><circle cx="31" cy="38" r="2"/><circle cx="62" cy="38" r="2"/></g>
  </symbol>
  <!-- Plateau-/Bergungsfahrzeug mit geneigter Ladefläche -->
  <symbol id="i-flat" viewBox="0 0 80 48">
    <path d="M2 21 L46 27 V31 L2 31 Z" fill="currentColor"/>
    <rect x="9" y="12" width="26" height="10" rx="2.5" fill="currentColor" opacity=".55" transform="rotate(7 22 17)"/>
    <circle cx="14" cy="22" r="2.6" fill="#2b2b29" transform="rotate(7 22 17)"/><circle cx="30" cy="22.5" r="2.6" fill="#2b2b29" transform="rotate(7 22 17)"/>
    <path d="M50 12h12c2 0 3 1 4 3l8 12v7H50z" fill="currentColor"/>
    <path d="M54.5 16h7l5.5 9H54.5z" fill="#fff" opacity=".92"/>
    <rect x="53" y="7" width="9" height="4" rx="1.5" fill="#FFB300"/>
    <rect x="2" y="29" width="76" height="6" rx="2" fill="currentColor"/>
    <g fill="#2b2b29" stroke="#fff" stroke-width="1.6"><circle cx="16" cy="38" r="6.2"/><circle cx="30" cy="38" r="6.2"/><circle cx="62" cy="38" r="6.2"/></g>
    <g fill="#bdbdb8"><circle cx="16" cy="38" r="2"/><circle cx="30" cy="38" r="2"/><circle cx="62" cy="38" r="2"/></g>
  </symbol>
  <!-- Schwerlast-Bergefahrzeug mit großem Kran -->
  <symbol id="i-heavy" viewBox="0 0 80 48">
    <path d="M10 25 L30 3 L40 3" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M40 3 V17" stroke="currentColor" stroke-width="2"/>

/* ---------- Datenhaltung ---------- */
function seed() {

}

function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.orders) return d; } catch (e) {} return seed(); }

  try { localStorage.setItem(KEY, JSON.stringify(DB)); }

let DB = load();

let myId = null; try { myId = sessionStorage.getItem('tr.my'); } catch (e) {}

/* ---------- Auftrags-Logik ---------- */
const prog = o => o.acceptedAt ? Math.max(0, Math.min(1, (Date.now() - o.acceptedAt) / DEMO_MS)) : 0;
function phase(o) {
  if (o.status === 'neu' || o.status === 'abgelehnt' || o.status === 'erledigt') return o.status;
  return prog(o) >= 1 ? 'vorort' : 'unterwegs';
}
const active = o => ['unterwegs', 'vorort'].includes(phase(o));
const truckBusy = t => !!t.busy || DB.orders.some(o => o.truckId === t.id && active(o));
const prio = o => (o.a.hurt === 'ja' || o.a.block === 'komplett' || o.a.cargo.includes('gefahr') || o.a.cargo.includes('leck')) ? 'Dringend' : 'Standard';

function routePts(o, t) {
  const s = { x:t.x, y:t.y }, e = { x:o.loc.x, y:o.loc.y }, m = { x:e.x, y:s.y };
  const pts = [s]; if (m.x !== s.x) pts.push(m); if (e.y !== m.y) pts.push(e);
  return pts.length > 1 ? pts : [s, { x:s.x + 1, y:s.y }];
}
const routeLen = pts => pts.slice(1).reduce((a, p, i) => a + Math.abs(p.x - pts[i].x) + Math.abs(p.y - pts[i].y), 0);
function posAt(pts, p) {
  let d = routeLen(pts) * p, dx = 1;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.abs(b.x - a.x) + Math.abs(b.y - a.y);
    if (b.x !== a.x) dx = Math.sign(b.x - a.x);
    if (d <= l || i === pts.length - 1) { const f = l ? Math.min(1, d / l) : 1; return { x:a.x + (b.x - a.x) * f, y:a.y + (b.y - a.y) * f, dx }; }
    d -= l;
  }
}
const distKm = (o, t) => routeLen(routePts(o, t)) / 20;
const etaMin = (o, t) => Math.max(6, Math.round(distKm(o, t) * 1.15));
const freeTrucks = o => TRUCKS.filter(t => !truckBusy(t)).sort((a, b) => distKm(o, a) - distKm(o, b));

/* ---------- Karte ---------- */
let BASE = '';

  simulate: () => {
    const i = DB.seq % LOCS.length, k = QS.map(q => q.o[(DB.seq + q.k.length) % q.o.length][0]);
    const o = { id: 'E-' + (++DB.seq), ts: Date.now(), plate: ['H-KL 7731', 'WOB-TR 902', 'HI-SP 5520'][i % 3], vtype: VTYPES[i % 4], name: ['Jens Boldt', 'Tomasz Kowal', 'Sven Richter'][i % 3], phone: '+49 160 5550' + (100 + i),
      loc: LOCS[i], a: { type: k[0], drive: k[1], block: k[2], hurt: k[3], cargo: i % 2 ? ['lad'] : [] }, photos: [demoPhoto(i), demoPhoto(i + 1)], memo: { sec: 9 + i * 3, bars: bars() }, status: 'neu', seen: false };
    DB.orders.push(o); save(); render();
  },
  zoom: d => { U.lb = getO(d.id).photos[+d.i]; render(); },
  unzoom: () => { U.lb = null; render(); },
};
function doAccept(id, tid) {
  const o = getO(id), t = getT(tid); if (!o || !t) return;
  Object.assign(o, { status: 'angenommen', truckId: t.id, eta: etaMin(o, t), acceptedAt: Date.now(), seen: true });
  save(); U.sel = id; U.tab = 'aktiv'; render();
}
function startRec() { U.rec = { sec: 0, t0: Date.now() }; }
function stopRec() {
  const s = Math.max(1, Math.round((Date.now() - U.rec.t0) / 1000)); U.form.memo = { sec: s, bars: bars() }; U.rec = null;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !A[t.dataset.act]) return;
  if (t.dataset.act === 'unzoom' && e.target.tagName === 'IMG') return;
  A[t.dataset.act](t.dataset, t, e);
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  if (b === 'plate') e.target.value = e.target.value.toUpperCase();
  U.form[b] = e.target.value;
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoIn') return;
  for (const f of e.target.files) { const d = await resizeImg(f); if (d) U.form.photos.push(d); }
  render();
});
window.addEventListener('storage', e => {            // Live-Sync zwischen zwei Browser-Tabs
  if (e.key !== KEY) return; DB = load();
  if (U.view === 'driver' && !myOrder()) return;       // Fahrer mitten im Formular nicht stören
  render();
});

/* ---------- Ticker: Fahrzeugbewegung, ETA, Aufnahme, Wiedergabe ---------- */
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-mv]').forEach(g => {
    const o = getO(g.dataset.mv), t = o && getT(o.truckId); if (!t) return;
    const pt = posAt(routePts(o, t), prog(o));
    g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    const fl = g.querySelector('.flip'); if (fl) fl.setAttribute('transform', pt.dx < 0 ? 'scale(-1,1)' : '');
  });
  document.querySelectorAll('[data-eta]').forEach(el => { const o = getO(el.dataset.eta); if (o) el.textContent = Math.max(1, Math.ceil(o.eta * (1 - prog(o)))); });
  document.querySelectorAll('[data-prog]').forEach(el => { const o = getO(el.dataset.prog); if (o) el.style.width = prog(o) * 100 + '%'; });
  if (U.rec) { U.rec.sec = (now - U.rec.t0) / 1000; const el = document.getElementById('recT'); if (el) el.textContent = mmss(U.rec.sec); }
  if (U.play) {
    const p = (now - U.play.start) / (U.play.sec * 1000), w = document.querySelector(`[data-wave="${U.play.key}"]`);
    if (p >= 1) { U.play = null; render(); }
    else if (w) {
      w.querySelectorAll('i').forEach((b, i, all) => b.classList.toggle('on', i / all.length < p));
      const tt = document.querySelector(`[data-playt="${U.play.key}"]`); if (tt) tt.textContent = mmss(p * U.play.sec);
    }
  }
  if (sigNow() !== U.sig) render();                   // Phase hat gewechselt (z. B. Fahrzeug angekommen)
}, 200);

render();
</script>
</body>
</html>
